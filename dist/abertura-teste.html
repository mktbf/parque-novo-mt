<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Teste de abertura · Parque Novo Mato Grosso</title>
<style>
 html,body{margin:0;height:100%;background:#0D2B4D;font-family:'Barlow Condensed',Barlow,system-ui,sans-serif;color:#fff;overflow:hidden}
 #globo{position:fixed;inset:0;transition:filter 2.4s ease,transform 2.4s ease}
 #globo.saindo{filter:blur(10px) brightness(1.08);transform:scale(1.04)}
 gmp-map-3d{width:100%;height:100%}
 #veu{position:fixed;inset:0;background:#0D2B4D;opacity:1;transition:opacity 1.8s ease;pointer-events:none;z-index:3}
 #veu.aberto{opacity:0}
 #vinheta{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(5,20,40,.55) 100%)}
 .faixa{position:fixed;left:0;right:0;height:9vh;background:#05121f;z-index:2;transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
 #faixaA{top:0}#faixaB{bottom:0}
 .sem-faixa #faixaA{transform:translateY(-100%)}.sem-faixa #faixaB{transform:translateY(100%)}
 .texto{position:fixed;left:7vw;bottom:16vh;z-index:4;opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.4s cubic-bezier(.2,.7,.2,1);text-shadow:0 2px 18px rgba(0,0,0,.55);pointer-events:none}
 .texto.on{opacity:1;transform:none}
 .texto small{display:block;font-family:Barlow,system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(11px,1.3vw,14px);opacity:.9;margin-bottom:10px}
 .texto b{display:block;font-weight:700;font-size:clamp(34px,6.4vw,82px);line-height:.95;letter-spacing:.01em}
 .texto i{display:block;width:64px;height:4px;background:#58B947;margin-top:18px;border-radius:2px}
 #maquete{position:fixed;inset:0;border:0;width:100%;height:100%;opacity:0;pointer-events:none;z-index:1;transform:scale(1.06);filter:blur(8px);transition:opacity 2.4s ease,transform 3s cubic-bezier(.2,.7,.2,1),filter 2.4s ease}
 #maquete.ativa{opacity:1;pointer-events:auto;transform:none;filter:none;z-index:5}
 #aviso{max-width:520px;margin:12vh auto;padding:24px;line-height:1.5;background:rgba(255,255,255,.06);border-radius:14px;font-family:Barlow,system-ui,sans-serif;position:relative;z-index:6}
 #pular{position:fixed;right:24px;top:calc(9vh + 16px);z-index:6;background:rgba(5,18,31,.55);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 16px;cursor:pointer;font:500 13px Barlow,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(6px)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="globo"></div>
<div id="vinheta"></div>
<div class="faixa" id="faixaA"></div><div class="faixa" id="faixaB"></div>
<div class="texto" id="t1"><small>Centro geodésico</small><b>No coração da<br>América do Sul</b><i></i></div>
<div class="texto" id="t2"><small>Cuiabá · Mato Grosso</small><b>Parque Novo<br>Mato Grosso</b><i></i></div>
<div class="texto" id="t3"><small>Maior complexo multieventos da América Latina</small><b>O Novo<br>Começa Aqui</b><i></i></div>
<div id="veu"></div>
<button id="pular" hidden>Pular</button>
<iframe id="maquete" title="Mapa 3D do parque" loading="eager"></iframe>
<script>
// Teste da abertura: voo do Google (satélite) até o parque e passagem para a maquete do projeto.
// A chave vem pela URL (?key=...), não fica gravada no site.
const PARQUE={lat:-15.4539,lng:-56.0832};
// A chave fica guardada so neste navegador (localStorage), nunca no site.
const ARM='pnmt-abertura-chave';
let key=new URLSearchParams(location.search).get('key');
try{ if(key){localStorage.setItem(ARM,key);history.replaceState(null,'',location.pathname);} else {key=localStorage.getItem(ARM);} }catch(e){}
const maquete=document.getElementById('maquete');
const T=id=>document.getElementById(id);
const mostra=(id,on)=>T(id).classList.toggle('on',on);
const espera=ms=>new Promise(r=>setTimeout(r,ms));
const pular=document.getElementById('pular');
let entrou=false,vooAcabou=false;
// So troca quando a maquete terminou de carregar (sem tela branca).
function maqueteProntaJa(){
  try{const w=maquete.contentWindow,d=maquete.contentDocument;return !!(w&&w._mapDebug&&d&&(d.querySelector('#loading')?.hidden||!d.querySelector('#loading')));}catch(e){return true;}
}
function trocarQuandoPronta(){
  const t0=Date.now();
  (function espera(){ if(maqueteProntaJa()||Date.now()-t0>20000){setTimeout(entrarNaMaquete,700);} else setTimeout(espera,250); })();
}
function entrarNaMaquete(){
  if(entrou)return;entrou=true;
  ['t1','t2','t3'].forEach(i=>mostra(i,false));pular.hidden=true;
  document.body.classList.add('sem-faixa');
  document.getElementById('globo').classList.add('saindo');
  maquete.classList.add('ativa');
}
maquete.src='./pnmt-mapa/';
if(!key){
  document.getElementById('globo').innerHTML='<div id="aviso"><b>Cole aqui a chave de teste do Google</b> (só na primeira vez; este navegador guarda).<br><br><input id="campo" type="password" autocomplete="off" placeholder="Chave do Google Maps" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:0;font:inherit"><br><br><button id="salvar" style="padding:10px 18px;border-radius:20px;border:0;background:#58B947;color:#0D2B4D;font:inherit;font-weight:700;cursor:pointer">Ver a abertura</button> <button id="semchave" style="padding:10px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;font:inherit;cursor:pointer">Ir direto para a maquete</button></div>';
  document.getElementById('veu').classList.add('aberto');
  document.getElementById('salvar').onclick=()=>{const v=document.getElementById('campo').value.trim();if(!v)return;try{localStorage.setItem(ARM,v);}catch(e){}location.reload();};
  document.getElementById('semchave').onclick=entrarNaMaquete;
}else{
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({key,v:"beta"});
  (async()=>{
    try{
      const {Map3DElement}=await google.maps.importLibrary('maps3d');
      const mapa=new Map3DElement({
        center:{lat:-14.2,lng:-56.6,altitude:0},
        range:900000,tilt:0,heading:0,mode:'SATELLITE',defaultUIHidden:true
      });
      document.getElementById('globo').append(mapa);
      pular.hidden=false;pular.onclick=entrarNaMaquete;
      // espera as imagens do Google carregarem antes de abrir a cortina
      const firme=(max)=>new Promise(res=>{let ok=false;const fim=()=>{if(!ok){ok=true;res();}};mapa.addEventListener('gmp-steadychange',e=>{if(e.isSteady)fim();});setTimeout(fim,max);});
      const voo=(cam,ms)=>new Promise(res=>{let ok=false;const fim=()=>{if(!ok){ok=true;res();}};mapa.addEventListener('gmp-animationend',fim,{once:true});mapa.flyCameraTo({endCamera:cam,durationMillis:ms});setTimeout(fim,ms+800);});
      await firme(7000);
      document.getElementById('veu').classList.add('aberto');
      await espera(900); if(entrou)return;
      mostra('t1',true);
      // etapa 1: desce do continente para Mato Grosso, girando de leve
      await voo({center:{lat:-15.35,lng:-56.15,altitude:0},range:160000,tilt:38,heading:-12},7500); if(entrou)return;
      mostra('t1',false); await espera(500); mostra('t2',true);
      // etapa 2: aproxima do parque em curva
      await voo({center:{lat:PARQUE.lat,lng:PARQUE.lng,altitude:180},range:5200,tilt:55,heading:16},6000); if(entrou)return;
      mostra('t2',false); await espera(400); mostra('t3',true);
      // etapa 3: pequena volta lenta em torno do parque
      mapa.flyCameraAround({camera:{center:{lat:PARQUE.lat,lng:PARQUE.lng,altitude:180},range:4600,tilt:52,heading:16},durationMillis:5200,rounds:0.035});
      await espera(4200); if(entrou)return;
      trocarQuandoPronta();
    }catch(e){
      console.warn('[abertura]',e);try{localStorage.removeItem(ARM);}catch(_){}entrarNaMaquete();
    }
  })();
}
</script>
</body>
</html>
